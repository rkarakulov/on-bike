name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# пакеты @rkarakulov/* читаются из GitHub Packages токеном GITHUB_TOKEN (доступ on-bike открыт в настройках пакетов)
permissions:
  contents: read
  packages: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-latest
    # интеграционные тесты API — на реальных PostgreSQL + PostGIS и Redis (.claude/rules/tests.md)
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: onbike
          POSTGRES_PASSWORD: onbike
          POSTGRES_DB: onbike
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onbike" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.8
        ports: ['6379:6379']
    env:
      DATABASE_URL_TEST: postgres://onbike:onbike@127.0.0.1:5432/onbike_test
      REDIS_URL_TEST: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # пользовательский .npmrc с токеном из NODE_AUTH_TOKEN для @rkarakulov/*
          registry-url: https://npm.pkg.github.com
          scope: '@rkarakulov'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm arch:check
      # turbo пропускает пакеты без изменений по кешу; на PR — только затронутые
      - name: typecheck & test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="--filter=...[origin/${{ github.base_ref }}]"
          fi
          pnpm turbo run typecheck test build $FILTER
      # dist API — CommonJS поверх ESM-пакетов базы (require(esm), две сборки drizzle): typecheck и vitest
      # этого не видят, поэтому модули dist загружаются отдельно (если API собирался в этом прогоне)
      - name: api dist loads
        working-directory: apps/api
        run: |
          if [ -d dist ]; then
            node -e "require('reflect-metadata');require('./dist/app.module');require('./dist/worker.module')"
          fi
