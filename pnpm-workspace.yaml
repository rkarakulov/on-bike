packages:
  - apps/*
  - packages/*

# Expo/Metro надёжнее работает с плоским node_modules
nodeLinker: hoisted

catalog:
  # tooling
  typescript: ~6.0.3
  typescript-eslint: ^8.72.0
  eslint: ^9.39.5
  '@eslint/js': ^9.39.5
  eslint-config-expo: ~58.0.4
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.13.0
  prettier: ^3.9.10
  prettier-plugin-astro: ^1.1.1
  turbo: ^2.11.10
  dependency-cruiser: ^18.7.0
  vitest: ^5.0.5
  '@types/node': ^24.19.2
  tsx: ^4.23.15
  # shared runtime
  zod: ^4.6.7
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ~19.3.0
  '@tanstack/react-query': ^5.104.5
  # backend
  '@nestjs/common': ^12.2.0
  '@nestjs/core': ^12.2.0
  '@nestjs/platform-fastify': ^12.2.0
  '@nestjs/testing': ^12.2.0
  '@nestjs/config': ^12.0.1
  '@nestjs/bullmq': ^12.0.0
  bullmq: ^6.4.0
  ioredis: ^6.0.0
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  pg: ^8.23.1
  '@types/pg': ^8.23.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  unplugin-swc: ^2.0.0
  '@swc/core': ^1.16.18

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
