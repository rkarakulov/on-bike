# Статика панели «Протокол» (сборка с base /admin/). TLS, сжатие и /v1 — на обратном прокси перед контейнером.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # за обратным прокси: редиректы относительные, без внутреннего хоста и порта
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location = /admin {
        return 301 /admin/;
    }

    # хешированные бандлы Vite — навсегда
    location /admin/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /admin/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        return 404;
    }
}
